<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flying Cats in Space 🐱🚀</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="hud">
    <div id="title">🐱 Flying Cats in Space</div>
    <div id="count">Cats online: <span id="online-count">1</span></div>
    <div id="hint">Click anywhere to fire a laser 🔫 — 3 hits and a cat explodes, respawns in 10s</div>
  </div>

  <div id="name-overlay">
    <div id="name-box">
      <div id="name-title">🐱 What's your cat's name?</div>
      <input id="name-input" maxlength="16" placeholder="Enter a name..." autocomplete="off" />
      <button id="name-submit">Start Flying</button>
    </div>
  </div>

  <canvas id="scene"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script src="cat.js"></script>
  <script src="main.js"></script>
</body>
</html>
